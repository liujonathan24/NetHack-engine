# vf-eval endpoint registry. Looked up by `-m <model>` lookup.
#
# Each block: model -> base URL + env var holding the key.
# Run vf-eval from the directory containing `configs/` or pass
# `--endpoints configs/endpoints.toml`.

[[endpoints]]
id   = "openai"
url  = "https://api.openai.com/v1"
key  = "OPENAI_API_KEY"
models = ["gpt-4.1-mini", "gpt-4.1", "gpt-4o-mini", "gpt-4o", "o1-mini", "o1"]

[[endpoints]]
id   = "anthropic"
url  = "https://api.anthropic.com/v1"
key  = "ANTHROPIC_API_KEY"
models = ["claude-opus-4-7", "claude-sonnet-4-6", "claude-haiku-4-5"]

[[endpoints]]
id   = "pinference"
url  = "https://api.pinference.ai/api/v1"
key  = "PI_API_KEY"
models = ["Qwen/Qwen3.5-9B", "Qwen/Qwen3-8B", "Qwen/Qwen3-32B"]

# Prime Inference also serves the GLM family (z-ai/*). Same endpoint + key.
# Used for Continual-Harness runs: a weaker GLM policy + a stronger GLM teacher.
[[endpoints]]
id   = "pinference-glm"
url  = "https://api.pinference.ai/api/v1"
key  = "PI_API_KEY"
models = ["z-ai/glm-4.5", "z-ai/glm-4.5-air", "z-ai/glm-4.6", "z-ai/glm-4.7", "z-ai/glm-4.7-flash", "z-ai/glm-5", "z-ai/glm-5.1", "z-ai/glm-5.2"]

# Prime Inference, BILLED TO THE FUNDED TEAM. Prime bills to the personal
# balance ($0) unless X-Prime-Team-ID names a funded team — without this header
# every call returns `insufficient_funds`. Team id from ~/.prime/config.json
# (team_name = "jonathanliu"). Route Gemini (BALROG-bench models) through here.
# NB: do NOT pass `-p prime` on the CLI — that overrides this registry entry and
# drops the header. Rely on model-in-registry resolution (default endpoints path).
[[endpoints]]
id   = "prime-team"
url  = "https://api.pinference.ai/api/v1"
key  = "PI_API_KEY"
headers = { "X-Prime-Team-ID" = "cmotasmp5005ppyp07dcoh50u" }
models = ["google/gemini-3-flash-preview", "google/gemini-3.1-pro-preview", "google/gemini-3.5-flash"]
